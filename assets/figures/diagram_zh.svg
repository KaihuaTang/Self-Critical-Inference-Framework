<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-label="Diagram of one SCI5 decoding step: the original input, two textual counterfactual prompts and two visual counterfactual images go through the LVLM; TC is the element-wise maximum of the original and textual counterfactual logits, VC is the original logits minus the mean of the visual counterfactual logits, and the next token is decoded from TC/tau1 + VC/tau2 under an adaptive plausibility constraint."><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px;fill:#59636e}.t{fill:#1f2328;font-size:14px;font-weight:600}.v{fill:#1f2328;font-weight:600;font-size:11.5px;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}.nm{fill:#1f2328}.h{fill:#1f2328;font-weight:600;font-size:12.5px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#1f2328}.grid{stroke:#e6e8eb}.ax{stroke:#8c959f}.f1{fill:#2a78d6}.f2{fill:#eb6834}.f3{fill:#1baf7a}.s1{stroke:#2a78d6}.s2{stroke:#eb6834}.s3{stroke:#1baf7a}.fg{fill:#9aa4af}.fl{fill:#ced5dc}.ring{stroke:#fff;stroke-width:2}.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.box{fill:#fff;stroke:#c9d1d9}.boxk{fill:#fff;stroke:#1f2328;stroke-width:1.5}.boxo{fill:#fdeeea;stroke:#c8341f;stroke-width:1.5}.ar{stroke:#8c959f;stroke-width:1.5;fill:none}.arh{fill:#8c959f}</style><rect x="0.5" y="0.5" width="759" height="355" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="20.0" y="28.0" class="t">SCI5 的一步解码：5 次前向，得到 1 个 token 分布</text><defs><marker id="pfah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arh" d="M0,0 L8,4 L0,8 z"/></marker></defs><rect class="boxk" x="20" y="48" width="246" height="50" rx="4"/><rect x="32" y="57" width="32" height="32" fill="#7fb3d9"/><rect x="32" y="76" width="32" height="13" fill="#5d9466"/><circle 